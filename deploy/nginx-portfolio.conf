# Portofolio: portfolio.codewithus.me, di belakang Cloudflare Tunnel (tunnel yang sama dengan faya & praktikum-pemdas).
#
#   sudo cp deploy/nginx-portfolio.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Hanya mendengar di 127.0.0.1: cloudflared yang menghubungi Cloudflare dari dalam, tidak ada port terbuka.
# 8123 praktikum, 8124 faya → situs ini 8125. Cek dulu: ss -ltnp | grep 8125
#
# Isi web root = hasil `next build` (out/), disalin deploy/deploy.sh. Halaman publik murni statis;
# satu-satunya proses di belakang adalah API planner (api-planner.service, port 8162).
# /data/github.json diperbarui harian oleh github-portfolio.timer.
# Awalan pf_ pada zona supaya tidak bentrok dengan situs lain (berkas ini di-include di dalam http{}).

# ---- Gerbang PIN untuk /planner dan /api (lapis kedua; lapis pertama Cloudflare Access, lihat README).
# /masuk menulis cookie pf_pin; nginx yang mencocokkan. PIN tidak pernah ada di kode situs.
# GANTI "000000" di KEDUA map di bawah dengan PIN-mu (6 digit atau lebih), lalu nginx -t && reload.
map $cookie_pf_pin $pf_pin_ok {
    "000000" 1;
    default  0;
}
# Tebakan salah (cookie ada tapi keliru) dibatasi 10/menit per IP. Cookie benar/kosong tidak dihitung.
map $cookie_pf_pin $pf_tebak {
    ""       "";
    "000000" "";
    default  $binary_remote_addr;
}
limit_req_zone $pf_tebak zone=pf_tebak:1m rate=10r/m;

server {
    listen 127.0.0.1:8125;
    server_name portfolio.codewithus.me;

    root /var/www/portfolio;
    index index.html;
    absolute_redirect off;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    # PENTING: location yang memasang add_header sendiri kehilangan semua add_header di sini.
    # Karena itu location di bawah memakai `expires` (bukan add_header) untuk cache.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # 'unsafe-inline' untuk script: export statis Next menyisipkan script inline (__next_f) + script tema
    # di <head>. Sumber luar: API Radar (HN, TheSportsDB) + Cloudflare Web Analytics (disisipkan otomatis oleh Cloudflare).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://r2.thesportsdb.com https://www.thesportsdb.com; font-src 'self'; connect-src 'self' https://hn.algolia.com https://www.thesportsdb.com https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Aset ber-hash dari Next: aman di-cache lama.
    location ^~ /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Data GitHub (ditulis ulang tiap hari): jangan di-cache lama.
    location ^~ /data/ {
        expires 1h;
        try_files $uri =404;
    }

    # ---- Planner pribadi. `expires -1` (bukan add_header) supaya header keamanan di atas tetap ikut.
    location ^~ /planner {
        limit_req zone=pf_tebak burst=5 nodelay;
        limit_req_status 429;
        if ($pf_pin_ok = 0) { return 302 /masuk; }
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    # API planner: instance kedua api.js dari repo web-faya (deploy/api-planner.service, port 8162).
    location ^~ /api/ {
        limit_req zone=pf_tebak burst=5 nodelay;
        limit_req_status 429;
        if ($pf_pin_ok = 0) { return 401; }
        proxy_pass http://127.0.0.1:8162;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # BRONE + Apps Script bisa lambat
        proxy_read_timeout 120s;
        client_max_body_size 256k;
    }

    location ^~ /masuk {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    # HTML: browser wajib cek ulang tiap buka (Cache-Control: no-cache), supaya deploy baru langsung terlihat.
    # Aset ber-hash di /_next/static/ tetap di-cache 1 tahun (location di atas).
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;
}
